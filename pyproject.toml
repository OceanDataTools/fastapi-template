[tool.poetry]
name = "OpenRVDAS"
version = "1.0.0"
description = "FastAPI-based API for OpenRVDAS"
authors = ["Webb Pinner <webbpinner@gmail.com>"]
license = "MIT"
readme = "README.md"

[[tool.poetry.packages]]
include = "app"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["all"], version = "^0.135.0"}
uvicorn = {extras = ["standard"], version = "^0.41.0"}
asyncpg = "^0.31.0"
psycopg = "^3.1"
alembic = "^1.16.4"
sqlalchemy = "^2.0.36"
greenlet = "^3.2.3"
python-multipart = "^0.0.22"
pydantic-settings = "^2.10.1"
bcrypt = "^4.0"
pyjwt = "^2.10.1"
python-dotenv = "^1.0"
aiosqlite = "^0.22"  # sqlite
sendgrid = "^6.12.5"
websockets = "^16.0"
parse = "^1.20"
pyserial = "^3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"  # sqlite
pre-commit = "^4.3.0"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
