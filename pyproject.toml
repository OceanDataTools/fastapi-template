[tool.poetry]
name = "odt-fastapi-backend"
version = "1.0.0"
description = "ODT backend server built with TimescaleDB (or SQLite) and FastAPI"
authors = ["Webb Pinner <webbpinner@gmail.com>"]
license = "MIT"
readme = "README.md"

[[tool.poetry.packages]]
include = "app"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["all"], version = "^0.116.1"}
uvicorn = {extras = ["standard"], version = "^0.29.0"}
asyncpg = "^0.30.0"
psycopg = "^3.1"
alembic = "^1.16.4"
sqlalchemy = "^2.0.36"
python-jose = { version = "3.3.0", extras = ["cryptography"] }
passlib = { version = "1.7.4", extras = ["bcrypt"] }
greenlet = "^3.2.3"
python-multipart = "^0.0.20"
pydantic-settings = "^2.10.1"
bcrypt = "<4.0"
pyjwt = "^2.10.1"
python-dotenv = "^1.0"
aiosqlite = "^0.18"  # sqlite
sendgrid = "^6.12.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21"  # sqlite
pre-commit = "^4.3.0"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
