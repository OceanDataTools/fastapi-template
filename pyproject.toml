[tool.poetry]
name = "odt-fastapi-backend"
version = "1.0.0"
description = "ODT backend server built with TimescaleDB (or SQLite) and FastAPI"
authors = ["Webb Pinner <webbpinner@gmail.com>"]
license = "MIT"
readme = "README.md"

[[tool.poetry.packages]]
include = "app"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["all"], version = "^0.135.0"}
uvicorn = {extras = ["standard"], version = "^0.41.0"}
asyncpg = "^0.31.0"
psycopg = "^3.1"
alembic = "^1.16.4"
sqlalchemy = "^2.0.36"
greenlet = "^3.2.3"
python-multipart = ">=0.0.22"
pydantic-settings = "^2.10.1"
bcrypt = "^4.0"
pyjwt = "^2.10.1"
python-dotenv = "^1.0"
aiosqlite = "^0.22"  # sqlite
sendgrid = "^6.12.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.0"
httpx = "^0.28"
pre-commit = "^4.3.0"
black = "^25.0"
isort = "^5.13"
flake8 = "^7.0"
mypy = "^1.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
