services:
  # -----------------------------
  # Timescale/Postgres services
  # -----------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - timescale-db

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file: .env
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - timescaledb
    profiles:
      - timescale-development

  # -----------------------------
  # Backend (FastAPI)
  # -----------------------------
  backend-timescale:
    build: .
    container_name: fastapi-timescale
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - timescaledb
    profiles:
      - timescale-db

  backend-sqlite:
    build: .
    container_name: fastapi-sqlite
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./db.sqlite3:/app/db.sqlite3
    profiles:
      - sqlite-db

volumes:
  timescale_data:
  pgadmin_data:
